<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>A&D Voice — регулятор громкости</title>
    <style>
      * { box-sizing: border-box; }

      html, body { margin: 0; min-width: 160px; min-height: 100%; background: transparent; }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
      }

      /* Уменьшайте --size: отрисовка автоматически подстроится под размер и DPI. */
      .knob {
        --size: min(94vw, 94svh, 840px);
        --angle: 45.9deg;
        --rotation: 0deg;
        position: relative;
        width: var(--size);
        aspect-ratio: 1;
        flex: none;
        isolation: isolate;
        -webkit-tap-highlight-color: transparent;
      }

      /* Та же геометрия, но с более яркой ruby/neon атмосферой под интерфейс A&D Voice. */
      .knob::before {
        content: "";
        position: absolute;
        inset: 3.8%;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 50%, transparent 58%, rgba(255, 21, 53, .055) 68%, transparent 78%);
        box-shadow:
          0 0 20px rgba(255, 18, 49, .18),
          0 0 52px rgba(255, 7, 42, .12),
          0 0 86px rgba(255, 5, 38, .06);
        z-index: -1;
      }

      .knob::after {
        content: "";
        position: absolute;
        inset: 8.6%;
        border-radius: 50%;
        pointer-events: none;
        border: 1px solid rgba(255, 72, 92, .16);
        box-shadow:
          inset 0 0 15px rgba(255, 17, 49, .12),
          0 0 12px rgba(255, 17, 49, .10);
      }

      .knob__surface {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        filter: drop-shadow(0 0 7px rgba(255, 18, 48, .18)) drop-shadow(0 0 20px rgba(255, 10, 44, .10));
      }

      .knob__control {
        position: absolute;
        inset: 5.5%;
        border-radius: 50%;
        cursor: grab;
        outline: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .knob__control:active,
      .knob.is-dragging .knob__control { cursor: grabbing; }

      .knob.is-dragging .knob__surface,
      .knob:hover .knob__surface {
        filter: drop-shadow(0 0 10px rgba(255, 26, 56, .28)) drop-shadow(0 0 28px rgba(255, 8, 44, .16));
      }

      /* Вращается сама ручка с насечкой, но не неподвижная внешняя шкала. */
      .knob__rotor {
        transform: rotate(var(--rotation));
        transform-origin: center;
        will-change: transform;
      }

      .knob__value {
        position: absolute;
        left: 50%;
        bottom: -1%;
        transform: translateX(-50%);
        color: #ffe9e8;
        font: 500 clamp(12px, 2.8vmin, 24px) / 1.1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 5px #fff8f8, 0 0 14px #ff385d, 0 0 30px #ff173866;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 0 7px rgba(255, 18, 48, .18)) drop-shadow(0 0 20px rgba(255, 10, 44, .10));
      }

      .knob:hover .knob__value,
      .knob:focus-within .knob__value,
      .knob.is-dragging .knob__value { opacity: 1; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .knob__control:focus-visible::after {
        content: "";
        position: absolute;
        inset: -2%;
        border: 2px solid #ff626e;
        border-radius: inherit;
        box-shadow: 0 0 12px #ff173e44;
        pointer-events: none;
        filter: drop-shadow(0 0 7px rgba(255, 18, 48, .18)) drop-shadow(0 0 20px rgba(255, 10, 44, .10));
      }

      /* Метка следует за ручкой. Шкала и её риски остаются на месте. */
      .knob__indicator {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        transform: rotate(var(--angle));
        pointer-events: none;
        will-change: transform;
      }

      .knob__slot {
        position: absolute;
        left: 48.4%;
        top: 16.65%;
        width: 3.2%;
        height: 11.25%;
        border-radius: 999px;
        background:
          linear-gradient(90deg, #090203 0%, #170102 25%, #430508 66%, #0e0102 100%);
        box-shadow:
          0 0 0 1px #0e0000,
          0 1px 1px 1px #ee7d7b80,
          inset 1px 3px 5px #000,
          0 0 10px 3px #ff001f60,
          0 0 24px 6px #ff001f28;
      }

      .knob__slot::before {
        content: "";
        position: absolute;
        inset: 9% 20%;
        border-radius: inherit;
        background: linear-gradient(90deg, #fe142a 0%, #ff777a 17%, #fff9ee 47%, #fff 62%, #ff898b 85%, #ff142c 100%);
        box-shadow:
          0 0 2px 1px #fff4ea,
          0 0 5px 2px #ff2336,
          0 0 14px 4px #ff001fd0,
          0 0 30px 8px #ff001f60,
          0 0 54px 12px #ed001a28;
      }

      .knob__slot::after {
        content: "";
        position: absolute;
        inset: -7% -40%;
        border-radius: 50%;
        background: radial-gradient(ellipse, #ff0c1714 20%, transparent 72%);
      }

      @media (prefers-reduced-motion: reduce) {
        .knob__indicator, .knob__rotor { will-change: auto; }
      }
    </style>
  </head>
  <body>
    <div class="knob" id="volume-knob" data-value="67">
      <canvas class="knob__surface knob__base" aria-hidden="true"></canvas>
      <canvas class="knob__surface knob__feedback" aria-hidden="true"></canvas>
      <canvas class="knob__surface knob__rotor" aria-hidden="true"></canvas>
      <div
        class="knob__control"
        role="slider"
        tabindex="0"
        aria-label="Громкость"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="67"
        aria-valuetext="67 процентов"
        aria-orientation="vertical"
        aria-describedby="knob-help"
      >
        <div class="knob__indicator" aria-hidden="true">
          <div class="knob__slot"></div>
        </div>
      </div>
      <div class="knob__value" aria-hidden="true">67%</div>
      <span id="knob-help" class="sr-only">
        Зажмите ручку ближе к краю и ведите мышью по кругу.
        За центр можно тянуть вверх или вниз. Нажатие на внешнюю шкалу
        устанавливает значение. Колесо мыши и стрелки меняют громкость.
        Shift — точная регулировка. Двойной щелчок — исходное значение.
      </span>
    </div>

    <script>
      "use strict";

      (() => {
        const root = document.querySelector("#volume-knob");
        const canvas = root.querySelector(".knob__base");
        const rotor = root.querySelector(".knob__rotor");
        const feedback = root.querySelector(".knob__feedback");
        const readout = root.querySelector(".knob__value");
        const rotorCtx = rotor.getContext("2d");
        const feedbackCtx = feedback.getContext("2d");
        const control = root.querySelector('[role="slider"]');
        const ctx = canvas.getContext("2d", { alpha: true });
        const TAU = Math.PI * 2;
        const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
        const mix = (a, b, amount) => a + (b - a) * amount;
        const fract = value => value - Math.floor(value);
        const noise = value => fract(Math.sin(value * 127.1 + 311.7) * 43758.5453123);
        const defaultValue = clamp(Number(root.dataset.value) || 0, 0, 100);
        const startAngle = -135;
        const sweepAngle = 270;
        const valueAngle = value => startAngle + value * sweepAngle / 100;
        const initialAngle = valueAngle(defaultValue);
        const degrees = 180 / Math.PI;
        const numberFormat = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 1 });
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        const listeners = new AbortController();
        let value = defaultValue;
        let visualValue = value;
        let drag = null;
        let renderTimer = 0;
        let animationFrame = 0;
        let previousFrame = 0;
        let disposed = false;

        // Фактура полностью процедурная. Здесь нет файлов изображений,
        // data URL, Base64, SVG, сетевых запросов или готовых текстур.
        function render() {
          if (!ctx || disposed) return;
          const cssSize = root.getBoundingClientRect().width;
          const size = Math.round(Math.min(1800, cssSize * Math.max(2, Math.min(devicePixelRatio || 1, 2.5))));
          if (!size || canvas.width === size && canvas.height === size) return;
          canvas.width = canvas.height = size;
          const center = size / 2;
          const radius = size * 0.445;
          const pixels = ctx.createImageData(size, size);
          const data = pixels.data;
          const brush = new Float32Array(Math.ceil(radius * 5) + 8);
          for (let i = 0; i < brush.length; i++) brush[i] = noise(i + 17) - 0.5;

          for (let y = 0; y < size; y++) {
            const yy = (y + 0.5 - center) / radius;
            for (let x = 0; x < size; x++) {
              const xx = (x + 0.5 - center) / radius;
              const r = Math.hypot(xx, yy);
              if (r > 1.055) continue;
              const index = (y * size + x) * 4;
              if (r > 1) {
                const a = Math.exp(-(r - 1) * 135) * 0.09;
                data[index] = 130;
                data[index + 1] = 0;
                data[index + 2] = 9;
                data[index + 3] = a * 255;
                continue;
              }

              const angle = Math.atan2(yy, xx);
              const ringPosition = r * radius * 1.8;
              const bi = Math.floor(ringPosition);
              const grain = mix(brush[bi], brush[bi + 1], ringPosition - bi);
              const grain2 = Math.sin(r * radius * 4.8 + Math.sin(angle * 17) * 0.3);
              const directional = Math.pow(Math.abs(Math.cos(angle + 0.77)), 16);
              const broad = Math.pow(Math.abs(Math.cos(angle - 0.86)), 5);
              const edgeLight = 0.5 + 0.5 * Math.cos(angle + 2.15);
              const grainAmount = grain * 9.5 + grain2 * 2.2;
              let red, green, blue;
              let v;

              if (r < 0.704) {
                // Концентрическая шлифовка и широкие анизотропные отражения.
                const radialLight = 0.7 + 0.3 * Math.sqrt(r / 0.704);
                const satin =
                  84 * Math.max(0, Math.cos(angle - 1.01)) ** 28 +
                  76 * Math.max(0, Math.cos(angle - 2.23)) ** 27 +
                  116 * Math.max(0, Math.cos(angle - 4.07)) ** 29 +
                  108 * Math.max(0, Math.cos(angle - 5.31)) ** 30;
                v = 7 + radialLight * satin + 11 * Math.abs(Math.cos(angle)) ** 14;
                v += grainAmount * (0.48 + v / 55);
                v += 9 * Math.exp(-r * 90);
                v *= 1 - 0.35 * Math.exp(-Math.pow((r - 0.699) / 0.009, 2));
                red = v; green = v * 0.995; blue = v * 1.025;
              } else if (r < 0.709) {
                v = 8 + 17 * edgeLight;
                red = v; green = v; blue = v;
              } else if (r < 0.715) {
                v = 85 + 133 * edgeLight + 25 * directional;
                red = v; green = v * 0.96; blue = v * 0.93;
              } else if (r < 0.729) {
                const t = (r - 0.715) / 0.014;
                v = (21 + 111 * directional + 55 * broad) * (1 - t * 0.55) + grainAmount;
                red = v + 5; green = v; blue = v * 0.98;
              } else if (r < 0.735) {
                v = 100 + 106 * edgeLight;
                red = v; green = v * 0.96; blue = v * 0.94;
              } else if (r < 0.743) {
                v = 5 + 11 * edgeLight;
                red = v + 10; green = v; blue = v;
              } else if (r < 0.814) {
                v = 9 + 8 * edgeLight + grainAmount;
                red = v + 8; green = v; blue = v;
              } else if (r < 0.819) {
                v = 72 + 115 * directional + 49 * edgeLight;
                red = v; green = v * 0.87; blue = v * 0.85;
              } else if (r < 0.872) {
                // Рубиновое световое углубление между корпусом и шкалой.
                const t = (r - 0.819) / 0.053;
                const arc = Math.exp(-Math.pow((t - 0.39) / 0.16, 2));
                const thin = Math.exp(-Math.pow((t - 0.39) / 0.025, 2));
                const outerRim = Math.exp(-Math.pow((t - 0.94) / 0.035, 2));
                const bright = 0.40 + 0.60 * Math.pow(Math.abs(Math.sin(angle)), 12);
                const side = Math.pow(Math.abs(Math.cos(angle)), 34) * 0.65;
                const reflection = clamp(bright + side);
                red = 29 + arc * 197 * reflection + thin * 83 + outerRim * 148;
                green = 1 + arc * 11 * reflection + thin * 95 * reflection + outerRim * 2;
                blue = 4 + arc * 13 * reflection + thin * 94 * reflection + outerRim * 6;
              } else if (r < 0.882) {
                v = 2 + 8 * edgeLight;
                red = v + 8; green = v; blue = v;
              } else if (r < 0.988) {
                v = 12 + 22 * directional + 11 * broad + grainAmount * 0.7;
                const innerEdge = Math.exp(-Math.pow((r - 0.885) / 0.003, 2));
                red = v + 9 * innerEdge; green = v; blue = v * 1.035;
              } else if (r < 0.9965) {
                v = 12 + 24 * edgeLight + 22 * directional;
                red = v; green = v; blue = v;
              } else {
                const t = (r - 0.9965) / 0.0035;
                v = (50 + 140 * edgeLight) * (1 - t);
                red = v; green = v; blue = v;
              }

              data[index] = clamp(red, 0, 255);
              data[index + 1] = clamp(green, 0, 255);
              data[index + 2] = clamp(blue, 0, 255);
              data[index + 3] = 255;
            }
          }
          ctx.putImageData(pixels, 0, 0);
          ctx.save();
          ctx.translate(center, center);
          ctx.scale(radius, radius);
          drawKnurl();
          drawReflections();
          drawTicks();
          ctx.restore();

          // Одна процедурная отрисовка при загрузке / изменении размера.
          // Во время вращения двигаем готовый слой, а не пересчитываем миллионы пикселей.
          rotor.width = rotor.height = size;
          feedback.width = feedback.height = size;
          if (rotorCtx) {
            rotorCtx.save();
            rotorCtx.beginPath();
            rotorCtx.arc(center, center, radius * 0.819, 0, TAU);
            rotorCtx.clip();
            rotorCtx.drawImage(canvas, 0, 0);
            rotorCtx.restore();
          }
          paintFeedback();
        }

        function drawKnurl() {
          const columns = 184;
          const rows = 6;
          const start = 0.744;
          const end = 0.813;
          const step = (end - start) / rows;
          const pitch = TAU / columns;
          const point = (radius, angle) => [Math.cos(angle) * radius, Math.sin(angle) * radius];
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, end, 0, TAU);
          ctx.arc(0, 0, start, TAU, 0, true);
          ctx.clip("evenodd");

          for (let row = -1; row <= rows; row++) {
            const r = start + (row + 0.5) * step;
            for (let column = 0; column < columns; column++) {
              const a = (column + (row % 2 ? 0.5 : 0)) * pitch;
              const middle = point(r, a);
              const vertices = [
                point(r - step * 0.94, a),
                point(r, a + pitch * 0.47),
                point(r + step * 0.94, a),
                point(r, a - pitch * 0.47)
              ];
              const globalLight = 0.52 + 0.48 * Math.cos(a + 1.9);
              const variation = 0.88 + noise(column * 19 + row * 317) * 0.2;

              for (let side = 0; side < 4; side++) {
                const p1 = vertices[side];
                const p2 = vertices[(side + 1) % 4];
                const direction = a + [-2.36, -0.78, 0.78, 2.36][side];
                const light = Math.max(0, Math.cos(direction + 2.15));
                const metal = (6 + light ** 5 * 228 + globalLight * 10) * variation;
                const ruby = Math.pow(Math.max(0, Math.sin(a)), 3) * 27;
                ctx.fillStyle = `rgb(${metal + ruby},${metal * 0.96},${metal * 0.93})`;
                ctx.beginPath();
                ctx.moveTo(...middle);
                ctx.lineTo(...p1);
                ctx.lineTo(...p2);
                ctx.closePath();
                ctx.fill();
              }
            }
          }
          ctx.restore();
        }

        function drawReflections() {
          // Узкие отражения в световом канале, а не размазанная неоновая заливка.
          const r = 0.8395;
          const glow = ctx.createRadialGradient(0, 0, 0.809, 0, 0, 0.896);
          glow.addColorStop(0, "#ff001800");
          glow.addColorStop(0.30, "#f8002020");
          glow.addColorStop(0.47, "#ff123f55");
          glow.addColorStop(0.70, "#d900141d");
          glow.addColorStop(1, "#ff001800");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 0.896, 0, TAU);
          ctx.arc(0, 0, 0.809, TAU, 0, true);
          ctx.fill("evenodd");

          for (const angle of [-Math.PI / 2, Math.PI / 2, Math.PI, 0]) {
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            const halo = ctx.createRadialGradient(px, py, 0, px, py, 0.055);
            halo.addColorStop(0, "#fff1f1b8");
            halo.addColorStop(0.20, "#ff315b72");
            halo.addColorStop(1, "#ff001800");
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(px, py, 0.055, 0, TAU);
            ctx.fill();
          }
        }

        function roundRect(x, y, width, height, radius) {
          ctx.beginPath();
          ctx.roundRect(x, y, width, height, radius);
          ctx.fill();
        }

        function drawTicks() {
          const scale = canvas.width * 0.445;
          for (let i = 0; i < 16; i++) {
            const major = i % 4 === 0;
            const width = major ? 0.012 : 0.010;
            const length = major ? 0.078 : 0.066;
            ctx.save();
            ctx.rotate(i * TAU / 16);
            ctx.fillStyle = "#020101";
            roundRect(-width / 2 - 0.004, -0.933 - length / 2 - 0.004, width + 0.008, length + 0.008, 0.006);
            ctx.strokeStyle = "#71312c";
            ctx.lineWidth = 0.0017;
            ctx.stroke();

            ctx.shadowColor = major ? "#ff1029" : "#e9152470";
            ctx.shadowBlur = scale * (major ? 0.034 : 0.010);
            ctx.fillStyle = major ? "#ff2447" : "#ff6c7d";
            roundRect(-width / 2, -0.933 - length / 2, width, length, 0.003);
            ctx.shadowBlur = 0;
            const fill = ctx.createLinearGradient(-width / 2, 0, width / 2, 0);
            fill.addColorStop(0, "#ff2539");
            fill.addColorStop(0.38, major ? "#fff8eb" : "#ffa19c");
            fill.addColorStop(0.7, major ? "#fff6e9" : "#ff938d");
            fill.addColorStop(1, "#f82538");
            ctx.fillStyle = fill;
            roundRect(-width * 0.34, -0.933 - length * 0.47, width * 0.68, length * 0.94, 0.002);
            ctx.restore();
          }
        }

        function paintFeedback() {
          if (!feedbackCtx || !feedback.width || disposed) return;
          const scale = feedback.width * 0.445;
          const start = (startAngle - 90) / degrees;
          const end = (valueAngle(visualValue) - 90) / degrees;
          feedbackCtx.clearRect(0, 0, feedback.width, feedback.height);
          feedbackCtx.save();
          feedbackCtx.translate(feedback.width / 2, feedback.height / 2);
          feedbackCtx.scale(scale, scale);

          // Световой канал показывает значение; оставшаяся часть слегка притушена.
          feedbackCtx.beginPath();
          feedbackCtx.arc(0, 0, 0.846, end, start + TAU);
          feedbackCtx.strokeStyle = "rgba(0, 0, 0, 0.78)";
          feedbackCtx.lineWidth = 0.052;
          feedbackCtx.stroke();

          if (visualValue > 0) {
            feedbackCtx.beginPath();
            feedbackCtx.arc(0, 0, 0.8395, start, end);
            feedbackCtx.lineCap = "round";
            feedbackCtx.lineWidth = 0.0070;
            feedbackCtx.shadowColor = "#ff163d";
            feedbackCtx.shadowBlur = scale * 0.034;
            feedbackCtx.strokeStyle = "rgba(255, 218, 224, 0.96)";
            feedbackCtx.stroke();
          }
          feedbackCtx.restore();
        }

        function paint() {
          root.style.setProperty("--angle", `${valueAngle(visualValue)}deg`);
          root.style.setProperty("--rotation", `${valueAngle(visualValue) - initialAngle}deg`);
          paintFeedback();
        }

        function animate(timestamp) {
          animationFrame = 0;
          if (disposed) return;
          const elapsed = previousFrame ? Math.min(64, timestamp - previousFrame) : 16;
          previousFrame = timestamp;
          const immediate = !!drag || reducedMotion.matches;
          visualValue = immediate ? value : visualValue + (value - visualValue) * (1 - Math.exp(-elapsed / 42));
          if (Math.abs(value - visualValue) < 0.005) visualValue = value;
          paint();
          if (visualValue !== value) animationFrame = requestAnimationFrame(animate);
          else previousFrame = 0;
        }

        function schedulePaint() {
          if (!animationFrame && !disposed) animationFrame = requestAnimationFrame(animate);
        }

        function emit(type) {
          root.dispatchEvent(new CustomEvent(type, {
            bubbles: true,
            detail: { value, normalized: value / 100 }
          }));
        }

        function setValue(next, notify = true) {
          if (disposed) return false;
          const numeric = Number(next);
          if (!Number.isFinite(numeric)) return false;
          const nextValue = Math.round(clamp(numeric, 0, 100) * 1000) / 1000;
          const changed = nextValue !== value;
          value = nextValue;
          root.dataset.value = String(value);
          control.setAttribute("aria-valuenow", String(value));
          control.setAttribute("aria-valuetext", `${numberFormat.format(value)} процентов`);
          control.title = `Громкость: ${numberFormat.format(value)}% · ведите по кругу или тяните за центр`;
          readout.textContent = `${numberFormat.format(value)}%`;
          schedulePaint();
          if (changed && notify) emit("input");
          return changed;
        }

        function commit() { if (!disposed) emit("change"); }

        function geometry() {
          const rect = control.getBoundingClientRect();
          return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, radius: rect.width / 2 };
        }

        function polar(event, center) {
          return Math.atan2(event.clientY - center.y, event.clientX - center.x) * degrees;
        }

        function normalizeAngle(angle) { return ((angle + 180) % 360 + 360) % 360 - 180; }

        function pointerDown(event) {
          if (event.button !== 0 || !event.isPrimary || drag || disposed) return;
          const center = geometry();
          const distance = Math.hypot(event.clientX - center.x, event.clientY - center.y) / center.radius;
          if (distance > 1.04) return;
          event.preventDefault();
          control.focus({ preventScroll: true });
          drag = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            center,
            angle: polar(event, center),
            mode: distance >= 0.36 ? "circular" : "linear",
            value,
            start: value,
            distance: clamp(center.radius * 1.2, 160, 420)
          };
          control.setPointerCapture(event.pointerId);
          root.classList.add("is-dragging");

          // Внешняя шкала поддерживает прямой выбор значения без скачка при захвате ручки.
          if (distance >= 0.88) {
            let angle = normalizeAngle(drag.angle + 90);
            if (Math.abs(angle) > 179.99) angle = value >= 50 ? 180 : -180;
            drag.value = clamp((angle - startAngle) / sweepAngle * 100, 0, 100);
            setValue(drag.value);
          }
        }

        function pointerMove(event) {
          if (!drag || event.pointerId !== drag.id) return;
          event.preventDefault();
          const precision = event.shiftKey ? 0.1 : 1;
          const angle = polar(event, drag.center);
          const radius = Math.hypot(event.clientX - drag.center.x, event.clientY - drag.center.y);
          let delta = 0;
          if (drag.mode === "circular") {
            // В самом центре угол не определён: пересечение центра не вызывает скачка.
            if (radius > drag.center.radius * 0.12 && drag.angle !== null) {
              delta = normalizeAngle(angle - drag.angle) / sweepAngle * 100;
            }
            drag.angle = radius > drag.center.radius * 0.12 ? angle : null;
          } else {
            delta = ((event.clientX - drag.x) - (event.clientY - drag.y)) / drag.distance * 100;
          }
          drag.x = event.clientX;
          drag.y = event.clientY;
          drag.value = clamp(drag.value + delta * precision, 0, 100);
          setValue(drag.value);
        }

        function finishDrag(cancelled = false) {
          if (!drag) return;
          const gesture = drag;
          drag = null;
          root.classList.remove("is-dragging");
          if (control.hasPointerCapture(gesture.id)) control.releasePointerCapture(gesture.id);
          if (cancelled) setValue(gesture.start);
          else if (value !== gesture.start) commit();
        }

        function pointerEnd(event) {
          if (!drag || event.pointerId !== drag.id) return;
          finishDrag(event.type === "pointercancel");
        }

        function keyDown(event) {
          if (event.key === "Escape" && drag) {
            event.preventDefault();
            finishDrag(true);
            return;
          }
          if (drag || event.ctrlKey || event.altKey || event.metaKey) return;
          const step = event.shiftKey ? 0.1 : 1;
          const keys = {
            ArrowUp: value + step,
            ArrowRight: value + step,
            ArrowDown: value - step,
            ArrowLeft: value - step,
            PageUp: value + 10,
            PageDown: value - 10,
            Home: 0,
            End: 100
          };
          if (!Object.hasOwn(keys, event.key)) return;
          event.preventDefault();
          if (setValue(keys[event.key])) commit();
        }

        function wheel(event) {
          if (event.ctrlKey || event.metaKey || event.deltaY === 0 || drag || disposed) return;
          event.preventDefault();
          control.focus({ preventScroll: true });
          if (setValue(value - Math.sign(event.deltaY) * (event.shiftKey ? 0.1 : 1))) commit();
        }

        function doubleClick(event) {
          event.preventDefault();
          finishDrag();
          if (setValue(defaultValue)) commit();
        }

        function scheduleRender() {
          clearTimeout(renderTimer);
          if (!disposed) renderTimer = setTimeout(render, 80);
        }

        const events = {
          pointerdown: pointerDown,
          pointermove: pointerMove,
          pointerup: pointerEnd,
          pointercancel: pointerEnd,
          lostpointercapture: pointerEnd,
          keydown: keyDown,
          dblclick: doubleClick
        };
        for (const [event, handler] of Object.entries(events)) {
          control.addEventListener(event, handler, { signal: listeners.signal });
        }
        control.addEventListener("wheel", wheel, { passive: false, signal: listeners.signal });
        window.addEventListener("blur", () => finishDrag(true), { signal: listeners.signal });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) finishDrag(true);
        }, { signal: listeners.signal });
        window.addEventListener("resize", scheduleRender, { signal: listeners.signal });
        const observer = new ResizeObserver(scheduleRender);
        observer.observe(root);

        setValue(value, false);
        render();
        paint();

        // Публичный API сохранён. Все значения находятся в диапазоне 0…100.
        // volumeKnob.value = 80;
        // volumeKnob.element.addEventListener("input", event => {
        //   audio.volume = event.detail.normalized;
        // });
        // Событие input — во время регулировки; change — после отпускания.
        // Сам по себе этот файл не изменяет системную громкость Windows.
        window.volumeKnob = {
          element: root,
          get value() { return value; },
          set value(next) { setValue(next); },
          reset() { if (setValue(defaultValue)) commit(); },
          destroy() {
            if (disposed) return;
            finishDrag();
            disposed = true;
            listeners.abort();
            observer.disconnect();
            clearTimeout(renderTimer);
            cancelAnimationFrame(animationFrame);
            animationFrame = 0;
            control.setAttribute("aria-disabled", "true");
            control.tabIndex = -1;
          }
        };
      })();
    </script>
  </body>
</html>
