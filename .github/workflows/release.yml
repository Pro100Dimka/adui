name: Release

# Push a tag like v2.0.0: the package is built here and attached to a GitHub release,
# so no build output has to live in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check package version matches tag
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          name: "@ad-voice/ui ${{ github.ref_name }}"
          files: release/ad-voice-ui-${{ env.VERSION }}.tgz
          generate_release_notes: true
